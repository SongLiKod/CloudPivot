<!DOCTYPE html>
<html lang="zh-CN" class="theme-light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#22C55E" />
    <meta name="description" content="云枢 CloudPivot - 多 Cloudflare 账号本地私有化运维客户端" />
    <title>云枢 CloudPivot</title>
    <style>
      html,
      body,
      #app {
        height: 100%;
        margin: 0;
      }
      .theme-light {
        --boot-bg: #ffffff;
        --boot-fg: #1f2937;
      }
      .theme-dark {
        --boot-bg: #111827;
        --boot-fg: #f9fafb;
      }
      body {
        background: var(--boot-bg, #ffffff);
      }
      .app-boot {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        color: var(--boot-fg, #1f2937);
        font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      .app-boot__logo {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 1px;
        color: #22c55e;
      }
      .app-boot__tip {
        font-size: 13px;
        opacity: 0.65;
      }
    </style>
    <script>
      // 首屏防闪烁：在框架加载前应用已保存的主题
      ;(function () {
        try {
          var raw = localStorage.getItem('cloudpivot-theme-mode')
          var mode = raw ? JSON.parse(raw) : 'system'
          var dark =
            mode === 'dark' ||
            (mode !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.className = dark ? 'theme-dark' : 'theme-light'
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.className = 'theme-light'
        }
      })()
    </script>
    <script type="module" crossorigin src="./assets/index-DxKjmWuh.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/vue-qzRgbOTM.js">
    <link rel="modulepreload" crossorigin href="./assets/element-C8pYhpUL.js">
    <link rel="stylesheet" crossorigin href="./assets/index-BRE7YzbD.css">
  </head>
  <body>
    <div id="app">
      <div class="app-boot">
        <div class="app-boot__logo">CloudPivot</div>
        <div class="app-boot__tip">云枢正在启动…</div>
      </div>
    </div>
  </body>
</html>
